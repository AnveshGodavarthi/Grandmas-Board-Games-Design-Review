name: Publish design review

on:
  push:
    branches:
      - main
    paths:
      - index.html
      - reviews/**
      - assets/**
      - tests/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Verify review surface
        run: |
          test -f index.html
          test -f reviews/online-turn-open-edge-landing/index.html
          test -f reviews/assets/online-turn-open-edge-landing-storyboard.png
          test -f reviews/ashta-chamma-veranda/index.html
          test -f reviews/assets/ashta-chamma-veranda-composition.webp
          grep -q "Design review" index.html
          grep -q 'href="reviews/online-turn-open-edge-landing/"' index.html
          grep -q 'href="reviews/ashta-chamma-veranda/"' index.html
          grep -q "Open Edge Landing + Remote Touch Echo" reviews/online-turn-open-edge-landing/index.html
          grep -q "Approved" reviews/online-turn-open-edge-landing/index.html
          grep -q "Ashta Chamma, at home on the veranda" reviews/ashta-chamma-veranda/index.html
          node tests/verify-open-edge-review.mjs
          node tests/verify-ashta-chamma-veranda.mjs
          node tests/verify-workflow-trigger.mjs

      - name: Upload review surface
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
